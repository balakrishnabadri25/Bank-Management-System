<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Bank — Bank Management System</title>
    <meta name="description" content="Aurora Bank — modern banking management. Create accounts, check balances, deposit and withdraw in seconds.">
    <meta name="theme-color" content="#070b14">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Inline SVG icon sprite (zero dependencies, crisp at any size) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
            <symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
            <symbol id="i-user-plus" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></symbol>
            <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></symbol>
            <symbol id="i-deposit" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="m8 12 4 4 4-4"/></symbol>
            <symbol id="i-withdraw" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16V8"/><path d="m8 12 4-4 4 4"/></symbol>
            <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
            <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
            <symbol id="i-arrow-right" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></symbol>
            <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
            <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
            <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
            <symbol id="i-trending" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></symbol>
            <symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
            <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
            <symbol id="i-bank" viewBox="0 0 24 24"><line x1="3" y1="21" x2="21" y2="21"/><line x1="3" y1="10" x2="21" y2="10"/><polyline points="5 6 12 3 19 6"/><line x1="4" y1="10" x2="4" y2="21"/><line x1="12" y1="10" x2="12" y2="21"/><line x1="20" y1="10" x2="20" y2="21"/></symbol>
        </defs>
    </svg>
</head>
<body>
    <!-- Ambient background -->
    <div class="bg" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- Offline banner (shown only when the backend is unreachable) -->
    <div id="offline-banner" class="offline-banner" hidden role="alert">
        <svg class="icon"><use href="#i-alert"/></svg>
        <span><strong>Backend unreachable.</strong> Make sure the Spring Boot server is running on port 8080.</span>
        <button class="btn btn-ghost btn-sm" id="retry-btn">
            <svg class="icon"><use href="#i-refresh"/></svg> Retry
        </button>
    </div>

    <!-- Top navigation -->
    <header class="nav" id="nav">
        <div class="nav-inner">
            <a class="brand" href="#/" aria-label="Aurora Bank home">
                <span class="brand-mark">A</span>
                <span class="brand-text">Aurora<em>Bank</em></span>
            </a>
            <nav class="nav-links" id="nav-links" aria-label="Primary">
                <a href="#/" data-nav="home"><svg class="icon"><use href="#i-home"/></svg> Home</a>
                <a href="#/create" data-nav="create"><svg class="icon"><use href="#i-user-plus"/></svg> Open Account</a>
                <a href="#/balance" data-nav="balance"><svg class="icon"><use href="#i-wallet"/></svg> Balance</a>
                <a href="#/deposit" data-nav="deposit"><svg class="icon"><use href="#i-deposit"/></svg> Deposit</a>
                <a href="#/withdraw" data-nav="withdraw"><svg class="icon"><use href="#i-withdraw"/></svg> Withdraw</a>
            </nav>
            <div class="nav-status" id="nav-status" title="Backend connection status">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Connecting…</span>
            </div>
        </div>
    </header>

    <main class="main" id="view" tabindex="-1">
        <!-- Views are rendered here by app.js -->
    </main>

    <footer class="footer">
        <p>Aurora Bank · Bank Management System · <span id="footer-year"></span></p>
        <p class="footer-secure"><svg class="icon"><use href="#i-shield"/></svg> 256-bit secured · IFSC <code>UBIN20250912</code></p>
    </footer>

    <!-- Toast notifications -->
    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

    <script src="app.js"></script>
</body>
</html>
